<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | DynAcuity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top right, var(--primary-glow), transparent 40%);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-small {
            font-family: 'Outfit';
            font-size: 1.5rem;
            color: var(--primary-purple);
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: white;
            font-size: 1rem;
            transition: var(--transition-fast);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-purple);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-full {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="auth-container animate-fade-in">
        <div class="auth-card" id="step1">
            <div class="logo-small">DynAcuity</div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; text-align: center;">Reset Password</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2.5rem; text-align: center; font-size: 0.95rem;">
                Enter
                your email to receive a secure reset code.</p>

            <form id="forgotForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Send Reset Code</button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html">Log In</a>
            </div>
        </div>

        <div class="auth-card" id="step2" style="display: none;">
            <div class="logo-small">DynAcuity</div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; text-align: center;">Set New Password</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2.5rem; text-align: center; font-size: 0.95rem;">
                Enter
                the 6-digit code sent to your email.</p>

            <form id="resetForm">
                <div class="form-group">
                    <label>6-Digit Reset Code</label>
                    <input type="text" id="otp" class="form-input" placeholder="123456" required maxlength="6">
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>New Password</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required
                        minlength="6">
                    <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.4rem;">
                        Must be less than 15 characters, with at least one capital letter and one special character.
                    </p>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Update Password</button>
            </form>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        let currentEmail = '';

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;

            btn.innerText = 'Sending...';
            btn.disabled = true;

            const success = await requestPasswordReset(email);
            if (success) {
                currentEmail = email;
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            }

            btn.innerText = originalText;
            btn.disabled = false;
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('otp').value;
            const newPassword = document.getElementById('newPassword').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;

            btn.innerText = 'Updating...';
            btn.disabled = true;

            const success = await resetPassword(currentEmail, otp, newPassword);
            if (success) {
                alert('Password reset successfully! Please log in.');
                window.location.href = 'login.html';
            }

            btn.innerText = originalText;
            btn.disabled = false;
        });
    </script>
</body>

</html>
